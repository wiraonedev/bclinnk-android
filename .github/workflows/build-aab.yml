name: Build Android App Bundle (.aab)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-aab:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🔧 Patch Compose Compiler & Kotlin Compatibility
        run: bash scripts/patch-android.sh

      - name: 📦 Build Android App Bundle (.aab) with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          echo "Memulai build Release Android App Bundle (.aab) untuk Google Play Store..."
          ./gradlew bundleRelease --no-daemon

      - name: 📤 Upload AAB Artifacts ke GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: bclinnk-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
