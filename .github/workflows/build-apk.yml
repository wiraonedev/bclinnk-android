name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih jenis APK yang ingin di-build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: 🔧 Configure Kotlin 1.9.25 for Compose Compatibility
        run: |
          echo "android.kotlinVersion=1.9.25" >> android/gradle.properties
          echo "kotlinVersion=1.9.25" >> android/gradle.properties
          sed -i 's/1.9.24/1.9.25/g' android/build.gradle || true

      - name: 🔨 Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "Memulai build Release APK..."
            ./gradlew assembleRelease --no-daemon -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25
          else
            echo "Memulai build Debug APK..."
            ./gradlew assembleDebug --no-daemon -Pandroid.kotlinVersion=1.9.25 -PkotlinVersion=1.9.25
          fi

      - name: 📤 Upload APK Artifacts ke GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: bclinnk-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
